# Tests and executables on every push and pull request, for x64 and natively for ARM64 (Windows on
# Arm), each on a runner of that processor. A pushed version tag (v1.9.1...) also publishes the
# four executables built and checked by the `build` jobs on the GitHub release of that tag, with
# notes taken from CHANGELOG.md: the published files are exactly the tested ones.
name: Tests and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_notes_for:
        description: "Run from the main branch (not a tag). Tag whose release notes to rewrite from CHANGELOG.md, for example v1.9.0; empty = just run the tests"
        required: false
        default: ""

# Actions are pinned to a commit (a tag can be moved), dependencies to their SHA-256 hashes
# (requirements*.txt): the build only uses code that was reviewed once.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    name: test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.14"
          architecture: ${{ matrix.arch }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements.txt
      - name: Run the tests
        run: python -m unittest discover -s tests -t . -v

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            suffix: ""
            machine: "34404"   # 0x8664, the PE Machine field of an x64 executable
          - arch: arm64
            runner: windows-11-arm
            suffix: "-ARM64"
            machine: "43620"   # 0xAA64: ARM64
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    env:
      SUFFIX: ${{ matrix.suffix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.14"
          architecture: ${{ matrix.arch }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install build dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-build.txt
      - name: Build the executables
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean --distpath dist --workpath build CloseAllPython.spec
          python -m PyInstaller --noconfirm --clean --distpath dist --workpath build CloseAllPython-CLI.spec
          if [ -n "$SUFFIX" ]; then
            mv dist/CloseAllPython.exe "dist/CloseAllPython$SUFFIX.exe"
            mv dist/CloseAllPython-CLI.exe "dist/CloseAllPython-CLI$SUFFIX.exe"
          fi
          ls -l dist
      - name: Check that the executables start
        # --self-test imports every bundled module and makes each kind of system call (windows,
        # process memory, sessions, the COM object of the desktop shortcut). It never opens a
        # window; the time limit only guards against an unexpected dialog.
        timeout-minutes: 5
        shell: pwsh
        run: |
          $gui = "dist/CloseAllPython$env:SUFFIX.exe"
          $cli = "dist/CloseAllPython-CLI$env:SUFFIX.exe"
          # Built for the right processor: native ARM64, not x64 run under emulation.
          foreach ($exe in $gui, $cli) {
            $bytes = [System.IO.File]::ReadAllBytes($exe)
            $machine = [BitConverter]::ToUInt16($bytes, [BitConverter]::ToInt32($bytes, 0x3C) + 4)
            if ($machine -ne ${{ matrix.machine }}) { throw "$exe is built for machine $machine, not ${{ matrix.arch }}" }
          }
          $version = python -c "import closeall; print(closeall.__version__)"
          $printed = (& $cli --version | Out-String).Trim()
          if ($printed -ne "CloseAllPython $version") { throw "CLI --version printed '$printed'" }
          $test = (& $cli --self-test | Out-String)
          Write-Output $test
          if ($LASTEXITCODE -ne 0) { throw "$cli --self-test failed ($LASTEXITCODE)" }
          if ($test -notmatch "\(${{ matrix.arch }}\) self-test: passed") { throw "$cli does not run as ${{ matrix.arch }}" }
          & $cli --no-ui --all --dry-run
          if ($LASTEXITCODE -ne 0) { throw "$cli --no-ui --all --dry-run failed ($LASTEXITCODE)" }
          $run = Start-Process -FilePath $gui -ArgumentList "--self-test" -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "$gui --self-test failed ($($run.ExitCode))" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: executables-${{ matrix.arch }}
          path: |
            dist/CloseAllPython${{ matrix.suffix }}.exe
            dist/CloseAllPython-CLI${{ matrix.suffix }}.exe
          if-no-files-found: error
          retention-days: 14

  release:
    # Only for a pushed tag. A manual run started "from a tag" executes the workflow as it was at
    # that tag and must never republish that release (it would rebuild and replace its files).
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: windows-latest
    permissions:
      contents: write   # create or update the release and its files
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.14"
      - name: Check that the tag matches the program version
        shell: bash
        run: |
          version=$(python -c "import closeall; print(closeall.__version__)")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match closeall.__version__ ($version)"
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: executables-*
          merge-multiple: true
          path: dist
      - name: Write the release notes
        # The notes cover every version since the previous release, so a version that never had
        # its own release (1.8.0, 1.9.3) still appears.
        shell: bash
        run: |
          gh release list --exclude-drafts --exclude-pre-releases --limit 100 --json tagName --jq '.[].tagName' > published.txt
          python .github/scripts/release_notes.py "$TAG" release-notes.md --published published.txt
      - name: Publish the release
        shell: bash
        run: |
          ls -l dist
          title="CloseAllPython $TAG"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$title" --notes-file release-notes.md
          else
            gh release create "$TAG" --title "$title" --notes-file release-notes.md --verify-tag
          fi
          gh release upload "$TAG" dist/CloseAllPython.exe dist/CloseAllPython-CLI.exe \
            dist/CloseAllPython-ARM64.exe dist/CloseAllPython-CLI-ARM64.exe --clobber

  notes:
    # Manual run (Actions › Tests and release › Run workflow): choose "Use workflow from: Branch:
    # main" and give the tag in the field. Its notes are rewritten from the CHANGELOG of main,
    # covering every version since the release before it. Files are not touched.
    if: github.event_name == 'workflow_dispatch' && inputs.release_notes_for != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write   # edit the release notes
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.release_notes_for }}
    steps:
      - name: Check that the workflow runs from a branch
        run: |
          if [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "::error::Started from $GITHUB_REF_TYPE $GITHUB_REF_NAME. Run it again with 'Use workflow from: Branch: main'."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.14"
      - name: Rewrite the release notes
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then echo "::error::Not a version tag: $TAG"; exit 1; fi
          gh release view "$TAG" > /dev/null
          gh release list --exclude-drafts --exclude-pre-releases --limit 100 --json tagName --jq '.[].tagName' > published.txt
          python .github/scripts/release_notes.py "$TAG" release-notes.md --published published.txt
          gh release edit "$TAG" --notes-file release-notes.md
