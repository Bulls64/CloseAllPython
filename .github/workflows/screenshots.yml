# Screenshots of the interface for the README, taken on a real Windows (tools/screenshots.py).
# Run it from Actions › Screenshots › Run workflow (or push the branch "screenshots"); the pictures
# are pushed to the branch "screenshots-results", to be copied into docs/screenshots.
name: Screenshots

on:
  workflow_dispatch:
  push:
    branches: [screenshots]

permissions:
  contents: write   # push the pictures to screenshots-results

jobs:
  screenshots:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements.txt
      - name: Larger screen
        continue-on-error: true
        shell: pwsh
        run: Set-DisplayResolution -Width 1600 -Height 1000 -Force
      - name: Take the screenshots
        run: python tools/screenshots.py screenshots
      - name: Publish the pictures
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd screenshots
          git init -q
          git checkout -q -b screenshots-results
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Screenshots for $GITHUB_SHA"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:screenshots-results
